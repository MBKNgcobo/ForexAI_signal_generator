name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      # Coverage is reported for visibility; it is deliberately not a hard
      # gate yet so that the untestable offline CLIs (data/training) do not
      # block unrelated pull requests.
      - name: Test (pytest)
        run: python -m pytest -q --cov=app --cov-report=term-missing
