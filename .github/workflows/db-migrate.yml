name: Database migrations

# Replaces the docker-compose "db-migrate" service and the Render cron job
# that used to live in render.yaml. Render cron jobs have no free tier (a
# minimum monthly charge applies to every one), and GitHub Actions runs this
# same command for free.
#
# Add these repository secrets first:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     NEON_CONNECTION_STRING  the Neon pooler connection string
#     JWT_KEY                 the same value Render generated for csharp-api
#
# Trigger it manually from the Actions tab ("Run workflow") after the first
# deploy, or let the nightly schedule keep the schema current.

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: scheduled workflows at :00
    # are heavily contended and frequently queue for several minutes.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # Never let two migration runs overlap against the same database.
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply EF Core migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Catch missing or malformed configuration in ~2 seconds instead of
      # after a full build. Each of the guards below mirrors a check that
      # Program.cs performs at startup, so a failure here names the variable
      # rather than surfacing as an Npgsql or JWT exception much later.
      - name: Validate configuration
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          status=0

          if [ -z "$NEON_CONNECTION_STRING" ]; then
            echo "::error::NEON_CONNECTION_STRING secret is empty or missing. Add it under Settings -> Secrets and variables -> Actions."
            status=1
          else
            # Npgsql accepts a key=value string or a postgresql:// URI.
            # Testing for '=' alone is not enough: a URI missing its scheme
            # ("ep-x-pooler.../forexai?sslmode=require") also contains an
            # '=' inside the query string and would be mistaken for
            # key=value. So for the key=value branch the part before the
            # first '=' must actually look like a keyword.
            case "$NEON_CONNECTION_STRING" in
              *://*)
                echo "NEON_CONNECTION_STRING: URI form detected."
                ;;
              *=*)
                key="${NEON_CONNECTION_STRING%%=*}"
                case "$key" in
                  *[!A-Za-z0-9_]*)
                    echo "::error::NEON_CONNECTION_STRING looks like a URI with no scheme. Prefix it with postgresql:// or use key=value (Host=...;Database=...;Username=...;Password=...;SSL Mode=Require)"
                    status=1
                    ;;
                  *)
                    echo "NEON_CONNECTION_STRING: key=value form detected."
                    ;;
                esac
                ;;
              *)
                echo "::error::NEON_CONNECTION_STRING is neither key=value nor a URI. Use Host=...;Database=...;Username=...;Password=...;SSL Mode=Require"
                status=1
                ;;
            esac
          fi

          if [ -z "$JWT_KEY" ]; then
            echo "::error::JWT_KEY secret is empty or missing. It must be the same value Render generated for csharp-api."
            status=1
          elif [ ${#JWT_KEY} -lt 32 ]; then
            # Program.cs rejects keys under 32 bytes.
            echo "::error::JWT_KEY is ${#JWT_KEY} chars; at least 32 are required."
            status=1
          fi

          exit $status

      - name: Apply migrations
        working-directory: ForexAI
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__ForexAiDatabase: ${{ secrets.NEON_CONNECTION_STRING }}
          Jwt__Key: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ForexAI
          Jwt__Audience: ForexAI.Client
          # --migrate returns before the host starts listening, so this is
          # never dialled; it is set only to satisfy startup validation.
          PythonApi__BaseUrl: http://127.0.0.1:8000
        run: |
          # --no-launch-profile stops `dotnet run` from loading
          # Properties/launchSettings.json, whose default profile forces
          # ASPNETCORE_ENVIRONMENT=Development and would silently override
          # the Production setting above.
          dotnet run \
            --no-launch-profile \
            --project ForexAI.Api/ForexAI.Api.csproj \
            --configuration Release \
            -- --migrate

      - name: Report result
        if: always()
        run: |
          echo "Migrations finished with exit code ${{ job.status }}."
