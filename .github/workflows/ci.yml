name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-ai:
    name: python-ai tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: forexai-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: forexai-ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # The suite is hermetic: no Twelve Data / LLM / database access.
        run: python -m pytest -q
