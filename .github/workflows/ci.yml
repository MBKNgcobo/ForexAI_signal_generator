name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-ai:
    name: python-ai tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: forexai-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: forexai-ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # The suite is hermetic: no Twelve Data / LLM / database access.
        run: python -m pytest -q

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml against .env.example
        # No secrets needed: .env.example supplies placeholder values.
        # Catches interpolation errors and invalid depends_on/healthcheck
        # definitions before they reach a deployment.
        run: docker compose --env-file .env.example config --quiet
